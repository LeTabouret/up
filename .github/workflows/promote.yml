---
name: Promote tested image
on:
  workflow_dispatch:
    inputs:
      digest:
        description: 'Exact Up sha256 digest that passed VM and rEFInd hardware validation'
        required: true
        type: string
      validation_complete:
        description: 'This digest passed boot, Secure Boot, gaming, update and rollback gates'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: up-release-promotion
  cancel-in-progress: false
env:
  FEDORA_VERSION: '44'
jobs:
  promote:
    if: >-
      inputs.validation_complete &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install registry copy tool
        run: sudo apt-get update && sudo apt-get install --yes skopeo
      - name: Verify and promote the tested digest without rebuilding
        env:
          DIGEST: ${{ inputs.digest }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          export REPOSITORY="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/up"
          export DOCKER_CONFIG="${RUNNER_TEMP}/up-promote-docker"
          export REGISTRY_AUTH_FILE="${DOCKER_CONFIG}/config.json"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | skopeo login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          bash .github/scripts/promote-image.sh manual
