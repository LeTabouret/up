---
name: Build container image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore: ['**/README.md']
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: up
  FEDORA_VERSION: '44'

jobs:
  validate:
    name: Static validation and tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt
      - name: Validate repository
        run: tests/validate.sh

  pr-build:
    name: Build pull request image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run bootc lint
        run: podman build --tag up:pr --file Containerfile .

  publish:
    name: Build, publish, and sign
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      # Podman and Cosign must share the same Docker-compatible GHCR credentials.
      DOCKER_CONFIG: ${{ runner.temp }}/docker
      REGISTRY_AUTH_FILE: ${{ runner.temp }}/docker/config.json
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prepare image coordinates and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA::7}"
          immutable_tag="${FEDORA_VERSION}-$(date -u +%Y%m%d)-${short_sha}"
          {
            echo "registry=${registry}"
            echo "immutable_tag=${immutable_tag}"
          } >>"${GITHUB_OUTPUT}"
      - name: Build and run bootc lint
        run: podman build --tag "${IMAGE_NAME}:build" --file Containerfile .
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${DOCKER_CONFIG}"
          printf '%s' "${GHCR_TOKEN}" | podman login \
            --authfile "${REGISTRY_AUTH_FILE}" \
            --username "${GITHUB_ACTOR}" \
            --password-stdin ghcr.io
      - name: Push immutable and friendly tags
        id: push
        env:
          REGISTRY: ${{ steps.image.outputs.registry }}
          IMMUTABLE_TAG: ${{ steps.image.outputs.immutable_tag }}
        shell: bash
        run: |
          set -euo pipefail
          destination="${REGISTRY}/${IMAGE_NAME}"
          podman push --authfile "${REGISTRY_AUTH_FILE}" --digestfile /tmp/image-digest \
            "${IMAGE_NAME}:build" "${destination}:${IMMUTABLE_TAG}"
          for tag in "${FEDORA_VERSION}" latest; do
            podman push --authfile "${REGISTRY_AUTH_FILE}" \
              "${IMAGE_NAME}:build" "${destination}:${tag}"
          done
          echo "digest=$(</tmp/image-digest)" >>"${GITHUB_OUTPUT}"
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign image digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
          REGISTRY: ${{ steps.image.outputs.registry }}
        run: >-
          cosign sign --yes --use-signing-config=false
          --key env://COSIGN_PRIVATE_KEY
          "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
