---
name: Build container image
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '05 10 * * *'
  workflow_dispatch:
concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  IMAGE_NAME: up
  FEDORA_VERSION: '44'
jobs:
  validate:
    name: Static validation and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install --yes shellcheck shfmt python3-yaml nodejs
      - run: tests/validate.sh
  build:
    name: Build and verify image
    if: github.event_name == 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify pinned upstream signature
        run: |
          base=$(awk '/^FROM ghcr.io\/ublue-os\/bazzite-gnome:/ {print $2}' Containerfile)
          cosign verify --key keys/bazzite.pub --new-bundle-format=false "$base"
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          version="${FEDORA_VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build and lint
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          podman build --tag localhost/up:build --file Containerfile \
            --build-arg "IMAGE_REPOSITORY=${REPOSITORY}" \
            --build-arg "IMAGE_VERSION=${VERSION}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" .
      - name: Image smoke tests
        run: tests/image-smoke.sh localhost/up:build
  publish:
    name: Build, verify and sign candidate
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Verify pinned upstream signature
        run: |
          base=$(awk '/^FROM ghcr.io\/ublue-os\/bazzite-gnome:/ {print $2}' Containerfile)
          cosign verify --key keys/bazzite.pub --new-bundle-format=false "$base"
      - name: Image coordinates
        id: image
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          version="${FEDORA_VERSION}-$(date -u +%Y%m%d)-${GITHUB_SHA::7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: Build and lint
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          podman build --tag localhost/up:build --file Containerfile \
            --build-arg "IMAGE_REPOSITORY=${REPOSITORY}" \
            --build-arg "IMAGE_VERSION=${VERSION}" \
            --build-arg "IMAGE_CREATED=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg "IMAGE_REVISION=${GITHUB_SHA}" .
      - name: Image smoke tests
        run: tests/image-smoke.sh localhost/up:build
      - name: Publish candidate, sign and verify
        if: >-
          github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          REPOSITORY: ${{ steps.image.outputs.repository }}
          VERSION: ${{ steps.image.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="${RUNNER_TEMP}/up-docker"
          export REGISTRY_AUTH_FILE="${DOCKER_CONFIG}/config.json"
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          podman push --digestfile "${RUNNER_TEMP}/up-digest" \
            localhost/up:build "${REPOSITORY}:${VERSION}"
          digest=$(cat "${RUNNER_TEMP}/up-digest")
          cosign sign --yes --new-bundle-format=false --use-signing-config=false --key env://COSIGN_PRIVATE_KEY "${REPOSITORY}@${digest}"
          cosign verify --key cosign.pub --new-bundle-format=false "${REPOSITORY}@${digest}"
          echo "Verified candidate (promotion requires VM and hardware validation): ${REPOSITORY}@${digest}" >> "$GITHUB_STEP_SUMMARY"
